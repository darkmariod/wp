services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: "http://localhost"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: inmobiliaria
      DB_USERNAME: inmobiliaria
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      ADMIN_PATH: "${ADMIN_PATH:-gestion}"
      ADMIN_ALLOWED_IPS: "${ADMIN_ALLOWED_IPS:-}"
      WHATSAPP_NUMBER: "${WHATSAPP_NUMBER:-593999999999}"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inmobiliaria
      MYSQL_USER: inmobiliaria
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootsecret}"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:
