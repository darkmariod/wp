services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - dokploy-network
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: "https://inmobiliaria-riobamba.duckdns.org"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: inmobiliaria
      DB_USERNAME: inmobiliaria
      DB_PASSWORD: "${DB_PASSWORD:-InmoRiobamba2026!}"
      ADMIN_PATH: "${ADMIN_PATH:-gestion}"
      ADMIN_ALLOWED_IPS: "${ADMIN_ALLOWED_IPS:-}"
      WHATSAPP_NUMBER: "${WHATSAPP_NUMBER:-593999999999}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inmobiliaria.rule=Host(`inmobiliaria-riobamba.duckdns.org`)"
      - "traefik.http.routers.inmobiliaria.entrypoints=websecure"
      - "traefik.http.routers.inmobiliaria.tls.certresolver=letsencrypt"
      - "traefik.http.services.inmobiliaria.loadbalancer.server.port=80"
      - "traefik.docker.network=dokploy-network"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    networks:
      - dokploy-network
    environment:
      MYSQL_DATABASE: inmobiliaria
      MYSQL_USER: inmobiliaria
      MYSQL_PASSWORD: "${DB_PASSWORD:-InmoRiobamba2026!}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-RootInmo2026!}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  dokploy-network:
    external: true
