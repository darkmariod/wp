<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1180" viewBox="0 0 1400 1180"><rect x="0" y="0" width="1400" height="1180" rx="0" fill="#0A0A0D" stroke="none" stroke-width="1"/><text x="64" y="74" font-family="Inter" font-size="34" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">Propuesta económica</text><text x="64" y="106" font-family="Inter" font-size="15" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Sitio web · Unidad Educativa Pestalozzi Ambato</text><rect x="1100" y="48" width="236" height="34" rx="17" fill="#1A1730" stroke="none" stroke-width="1"/><text x="1218" y="70" font-family="Inter" font-size="11" fill="#7C5CFF" font-weight="700" text-anchor="middle" letter-spacing="1.2">VÁLIDA POR 15 DÍAS</text><line x1="64" y1="140" x2="1336" y2="140" stroke="#26262E" stroke-width="1"/><rect x="64" y="172" width="500" height="400" rx="18" fill="#131318" stroke="#7C5CFF" stroke-width="1.5"/><rect x="98" y="152" width="154" height="34" rx="17" fill="#7C5CFF" stroke="none" stroke-width="1"/><text x="175" y="174" font-family="Inter" font-size="10.5" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="1">PLAN RECOMENDADO</text><text x="100" y="236" font-family="Inter" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">Sitio Informativo</text><text x="100" y="266" font-family="Inter" font-size="14" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">4 secciones que explican quiénes son</text><text x="100" y="288" font-family="Inter" font-size="14" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">y convierten visitas en matrículas.</text><line x1="100" y1="316" x2="528" y2="316" stroke="#26262E" stroke-width="1"/><text x="100" y="348" font-family="Inter" font-size="10.5" fill="#6E6E7A" font-weight="700" text-anchor="start" letter-spacing="1.4">PAGO ÚNICO DE ARRANQUE</text><text x="100" y="396" font-family="Inter" font-size="46" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">$450</text><text x="220" y="394" font-family="Inter" font-size="13" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">una sola vez</text><text x="344" y="348" font-family="Inter" font-size="10.5" fill="#6E6E7A" font-weight="700" text-anchor="start" letter-spacing="1.4">MANTENIMIENTO ANUAL</text><text x="344" y="396" font-family="Inter" font-size="46" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">$140</text><text x="464" y="394" font-family="Inter" font-size="13" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">cada año</text><line x1="100" y1="424" x2="528" y2="424" stroke="#26262E" stroke-width="1"/><text x="100" y="456" font-family="Inter" font-size="13.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Entrega en 12 días · 2 rondas de cambios</text><rect x="100" y="480" width="428" height="64" rx="12" fill="#16131F" stroke="none" stroke-width="1"/><text x="120" y="506" font-family="Inter" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">Primer año: $450 + $140 = $590</text><text x="120" y="528" font-family="Inter" font-size="13" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Años siguientes: solo $140</text><text x="620" y="196" font-family="Inter" font-size="11" fill="#7C5CFF" font-weight="700" text-anchor="start" letter-spacing="1.6">QUÉ INCLUYE</text><circle cx="631" cy="227" r="11" fill="#1A1730"/><path d="M626 226 l4 5 l7 -9" stroke="#7C5CFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="232" font-family="Inter" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0">Las 4 secciones completas</text><text x="654" y="250" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">Inicio, Nosotros, Galería y Contacto</text><circle cx="631" cy="269" r="11" fill="#1A1730"/><path d="M626 268 l4 5 l7 -9" stroke="#7C5CFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="274" font-family="Inter" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0">Dominio, hosting y SSL incluidos</text><text x="654" y="292" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">El candado de seguridad y la dirección .com, el primer año</text><circle cx="631" cy="311" r="11" fill="#1A1730"/><path d="M626 310 l4 5 l7 -9" stroke="#7C5CFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="316" font-family="Inter" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0">Galería que administran ustedes</text><text x="654" y="334" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">Suben y borran fotos sin depender de mí</text><circle cx="631" cy="353" r="11" fill="#1A1730"/><path d="M626 352 l4 5 l7 -9" stroke="#7C5CFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="358" font-family="Inter" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0">Botón de WhatsApp y formulario</text><text x="654" y="376" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">Los mensajes llegan al correo y al celular</text><circle cx="631" cy="395" r="11" fill="#1A1730"/><path d="M626 394 l4 5 l7 -9" stroke="#7C5CFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="400" font-family="Inter" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0">Se ve bien en celular y computadora</text><text x="654" y="418" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">Se acomoda solo a cualquier pantalla</text><circle cx="631" cy="437" r="11" fill="#1A1730"/><path d="M626 436 l4 5 l7 -9" stroke="#7C5CFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="442" font-family="Inter" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0">SEO configurado sección por sección</text><text x="654" y="460" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">Para que aparezcan al buscar &quot;colegios en Ambato&quot;</text><circle cx="631" cy="479" r="11" fill="#1A1730"/><path d="M626 478 l4 5 l7 -9" stroke="#7C5CFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="484" font-family="Inter" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0">Ficha de Google Business optimizada</text><text x="654" y="502" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">Con mapa, horario, teléfono y fotos</text><circle cx="631" cy="521" r="11" fill="#1A1730"/><path d="M626 520 l4 5 l7 -9" stroke="#7C5CFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="526" font-family="Inter" font-size="14.5" fill="#FFFFFF" font-weight="600" text-anchor="start" letter-spacing="0">Carga en menos de 1 segundo</text><text x="654" y="544" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">Garantizado, o lo corrijo sin costo</text><rect x="64" y="620" width="648" height="210" rx="16" fill="#101015" stroke="#26262E" stroke-width="1"/><text x="96" y="662" font-family="Inter" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">¿Por qué son dos pagos?</text><text x="96" y="698" font-family="Inter" font-size="13.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">El de $450 es construir la casa: diseño, programación y</text><text x="96" y="720" font-family="Inter" font-size="13.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">publicación. Se paga una sola vez.</text><text x="96" y="752" font-family="Inter" font-size="13.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">El de $140 al año es mantenerla parada: el alquiler del</text><text x="96" y="774" font-family="Inter" font-size="13.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">dominio y el servidor, el certificado de seguridad, las</text><text x="96" y="796" font-family="Inter" font-size="13.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">copias de respaldo y las actualizaciones.</text><rect x="736" y="620" width="600" height="210" rx="16" fill="#101015" stroke="#26262E" stroke-width="1"/><text x="768" y="662" font-family="Inter" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">Qué necesito de ustedes</text><circle cx="776" cy="692" r="3" fill="#7C5CFF"/><text x="792" y="696" font-family="Inter" font-size="13" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Qué niveles ofertan (Inicial, Básica, Bachillerato)</text><circle cx="776" cy="719" r="3" fill="#7C5CFF"/><text x="792" y="723" font-family="Inter" font-size="13" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Misión, visión y valores por escrito</text><circle cx="776" cy="746" r="3" fill="#7C5CFF"/><text x="792" y="750" font-family="Inter" font-size="13" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Horario de atención</text><circle cx="776" cy="773" r="3" fill="#7C5CFF"/><text x="792" y="777" font-family="Inter" font-size="13" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Fotos en buena calidad con autorización firmada</text><circle cx="776" cy="800" r="3" fill="#7C5CFF"/><text x="792" y="804" font-family="Inter" font-size="13" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Decidir el dominio (ej. pestalozziambato.edu.ec)</text><text x="64" y="880" font-family="Inter" font-size="11" fill="#7C5CFF" font-weight="700" text-anchor="start" letter-spacing="1.6">CÓMO SERÍAN LOS 12 DÍAS</text><rect x="64" y="904" width="303" height="118" rx="14" fill="#131318" stroke="#26262E" stroke-width="1"/><circle cx="96" cy="940" r="15" fill="#1A1730"/><text x="96" y="945" font-family="Inter" font-size="14" fill="#7C5CFF" font-weight="700" text-anchor="middle" letter-spacing="0">1</text><text x="122" y="938" font-family="Inter" font-size="11.5" fill="#6E6E7A" font-weight="700" text-anchor="start" letter-spacing="1">Días 1-2</text><text x="122" y="956" font-family="Inter" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">Contenido</text><text x="96" y="992" font-family="Inter" font-size="12.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Me entregan textos y fotos</text><text x="377" y="968" font-family="Inter" font-size="20" fill="#6E6E7A" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="387" y="904" width="303" height="118" rx="14" fill="#131318" stroke="#26262E" stroke-width="1"/><circle cx="419" cy="940" r="15" fill="#1A1730"/><text x="419" y="945" font-family="Inter" font-size="14" fill="#7C5CFF" font-weight="700" text-anchor="middle" letter-spacing="0">2</text><text x="445" y="938" font-family="Inter" font-size="11.5" fill="#6E6E7A" font-weight="700" text-anchor="start" letter-spacing="1">Días 3-5</text><text x="445" y="956" font-family="Inter" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">Diseño</text><text x="419" y="992" font-family="Inter" font-size="12.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Les muestro cómo va a quedar</text><text x="700" y="968" font-family="Inter" font-size="20" fill="#6E6E7A" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="710" y="904" width="303" height="118" rx="14" fill="#131318" stroke="#26262E" stroke-width="1"/><circle cx="742" cy="940" r="15" fill="#1A1730"/><text x="742" y="945" font-family="Inter" font-size="14" fill="#7C5CFF" font-weight="700" text-anchor="middle" letter-spacing="0">3</text><text x="768" y="938" font-family="Inter" font-size="11.5" fill="#6E6E7A" font-weight="700" text-anchor="start" letter-spacing="1">Días 6-10</text><text x="768" y="956" font-family="Inter" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">Programación</text><text x="742" y="992" font-family="Inter" font-size="12.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">Construyo las 4 secciones</text><text x="1023" y="968" font-family="Inter" font-size="20" fill="#6E6E7A" font-weight="400" text-anchor="middle" letter-spacing="0">›</text><rect x="1033" y="904" width="303" height="118" rx="14" fill="#131318" stroke="#26262E" stroke-width="1"/><circle cx="1065" cy="940" r="15" fill="#1A1730"/><text x="1065" y="945" font-family="Inter" font-size="14" fill="#7C5CFF" font-weight="700" text-anchor="middle" letter-spacing="0">4</text><text x="1091" y="938" font-family="Inter" font-size="11.5" fill="#6E6E7A" font-weight="700" text-anchor="start" letter-spacing="1">Días 11-12</text><text x="1091" y="956" font-family="Inter" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">Ajustes</text><text x="1065" y="992" font-family="Inter" font-size="12.5" fill="#9A9AA6" font-weight="400" text-anchor="start" letter-spacing="0">2 rondas de cambios y publicación</text><line x1="64" y1="1074" x2="1336" y2="1074" stroke="#26262E" stroke-width="1"/><text x="64" y="1112" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">El precio no incluye la compra del dominio .edu.ec si el Ministerio cobra un valor aparte.</text><text x="64" y="1136" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="start" letter-spacing="0">Cualquier sección adicional después de aprobado el alcance se cotiza por separado.</text><text x="1336" y="1112" font-family="Inter" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="end" letter-spacing="0">Mario Pazmiño</text><text x="1336" y="1136" font-family="Inter" font-size="12.5" fill="#6E6E7A" font-weight="400" text-anchor="end" letter-spacing="0">Desarrollo web</text></svg>