<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3648" viewBox="0 0 1440 3648"><rect width="1440" height="3648" fill="#FFFFFF"/><g id="Barra de anuncio"><rect x="0" y="0" width="1440" height="36" fill="#0D0D0D" stroke="none" stroke-width="1"/><text x="720" y="23" font-family="Inter" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle" letter-spacing="0.4">Matrículas abiertas · Ciclo lectivo 2026 – 2027</text></g><g id="Encabezado"><rect x="0" y="36" width="1440" height="72" fill="#FFFFFF" stroke="none" stroke-width="1"/><line x1="0" y1="108" x2="1440" y2="108" stroke="#E4E4E4" stroke-width="1"/><text x="80" y="81" font-family="Inter" font-size="22" fill="#0D0D0D" font-weight="400" text-anchor="start" letter-spacing="3.2">PESTALOZZI</text><text x="520" y="80" font-family="Inter" font-size="14" fill="#0D0D0D" font-weight="600" text-anchor="start" letter-spacing="0">Inicio</text><line x1="520" y1="88" x2="565.6" y2="88" stroke="#0D0D0D" stroke-width="1.6"/><text x="611.6" y="80" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Nosotros</text><text x="718.4" y="80" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Galería</text><text x="817.6" y="80" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Contacto</text><circle cx="1150" cy="69" r="7" fill="none" stroke="#0D0D0D" stroke-width="1.8"/><line x1="1155" y1="74" x2="1160" y2="79" stroke="#0D0D0D" stroke-width="1.8"/><text x="1360" y="80" font-family="Inter" font-size="14" fill="#0D0D0D" font-weight="600" text-anchor="end" letter-spacing="0">099 824 6396</text></g><g id="Portada"><rect x="0" y="108" width="1440" height="520" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="720" y="326" font-family="Inter" font-size="46" fill="#0D0D0D" font-weight="700" text-anchor="middle" letter-spacing="-0.4">El niño en el centro</text><text x="720" y="380" font-family="Inter" font-size="46" fill="#0D0D0D" font-weight="700" text-anchor="middle" letter-spacing="-0.4">de su aprendizaje</text><text x="720" y="424" font-family="Inter" font-size="15" fill="#4A4A4A" font-weight="400" text-anchor="middle" letter-spacing="0">Formación integral desde la filosofía que puso al estudiante primero.</text><text x="720" y="448" font-family="Inter" font-size="15" fill="#4A4A4A" font-weight="400" text-anchor="middle" letter-spacing="0">Unidad Educativa Pestalozzi · Ambato, Ecuador</text><rect x="510" y="484" width="200" height="46" fill="#0D0D0D" stroke="none" stroke-width="1"/><text x="610" y="511.5" font-family="Inter" font-size="13" fill="#FFFFFF" font-weight="500" text-anchor="middle" letter-spacing="0.6">AGENDA TU VISITA</text><rect x="730" y="484" width="200" height="46" fill="none" stroke="#0D0D0D" stroke-width="1.4"/><text x="830" y="511.5" font-family="Inter" font-size="13" fill="#0D0D0D" font-weight="500" text-anchor="middle" letter-spacing="0.6">CONOCE LA PROPUESTA</text></g><g id="Propuesta educativa"><text x="720" y="738" font-family="Inter" font-size="30" fill="#0D0D0D" font-weight="700" text-anchor="middle" letter-spacing="-0.4">Nuestra Propuesta Educativa</text><text x="720" y="772" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="middle" letter-spacing="0">Tres dimensiones que Pestalozzi puso en el centro de la enseñanza</text><rect x="80" y="820" width="405.333" height="200" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="80" y="1054" font-family="Inter" font-size="11" fill="#7B7B7B" font-weight="600" text-anchor="start" letter-spacing="1.6">CABEZA</text><text x="80" y="1082" font-family="Inter" font-size="19" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">El pensamiento</text><text x="80" y="1112" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Observación, razonamiento y</text><text x="80" y="1134" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">lenguaje. El estudiante entiende</text><text x="80" y="1156" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">antes de memorizar.</text><rect x="517.333" y="820" width="405.333" height="200" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="517.333" y="1054" font-family="Inter" font-size="11" fill="#7B7B7B" font-weight="600" text-anchor="start" letter-spacing="1.6">CORAZÓN</text><text x="517.333" y="1082" font-family="Inter" font-size="19" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">La formación humana</text><text x="517.333" y="1112" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Valores, convivencia y confianza.</text><text x="517.333" y="1134" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">El vínculo con el maestro sostiene</text><text x="517.333" y="1156" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">el aprendizaje.</text><rect x="954.667" y="820" width="405.333" height="200" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="954.667" y="1054" font-family="Inter" font-size="11" fill="#7B7B7B" font-weight="600" text-anchor="start" letter-spacing="1.6">MANO</text><text x="954.667" y="1082" font-family="Inter" font-size="19" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">La práctica</text><text x="954.667" y="1112" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Se aprende haciendo: arte, oficio,</text><text x="954.667" y="1134" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">experimentación y juego dentro</text><text x="954.667" y="1156" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">del aula.</text></g><g id="Niveles educativos"><rect x="0" y="1180" width="1440" height="572" fill="#F8F8F8"/><rect x="0" y="1180" width="1440" height="1" fill="#F8F8F8" stroke="none" stroke-width="1"/><text x="720" y="1290" font-family="Inter" font-size="30" fill="#0D0D0D" font-weight="700" text-anchor="middle" letter-spacing="-0.4">Niveles Educativos</text><text x="720" y="1324" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="middle" letter-spacing="0">Por confirmar con la institución los niveles que oferta actualmente</text><rect x="80" y="1372" width="296" height="220" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="80" y="1626" font-family="Inter" font-size="17" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Inicial</text><text x="80" y="1650" font-family="Inter" font-size="12.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Edades y jornada</text><text x="80" y="1672" font-family="Inter" font-size="12.5" fill="#0D0D0D" font-weight="600" text-anchor="start" letter-spacing="0">Ver detalle →</text><rect x="408" y="1372" width="296" height="220" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="408" y="1626" font-family="Inter" font-size="17" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Preparatoria</text><text x="408" y="1650" font-family="Inter" font-size="12.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Edades y jornada</text><text x="408" y="1672" font-family="Inter" font-size="12.5" fill="#0D0D0D" font-weight="600" text-anchor="start" letter-spacing="0">Ver detalle →</text><rect x="736" y="1372" width="296" height="220" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="736" y="1626" font-family="Inter" font-size="17" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Básica Elemental</text><text x="736" y="1650" font-family="Inter" font-size="12.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Edades y jornada</text><text x="736" y="1672" font-family="Inter" font-size="12.5" fill="#0D0D0D" font-weight="600" text-anchor="start" letter-spacing="0">Ver detalle →</text><rect x="1064" y="1372" width="296" height="220" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="1064" y="1626" font-family="Inter" font-size="17" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Básica Media</text><text x="1064" y="1650" font-family="Inter" font-size="12.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Edades y jornada</text><text x="1064" y="1672" font-family="Inter" font-size="12.5" fill="#0D0D0D" font-weight="600" text-anchor="start" letter-spacing="0">Ver detalle →</text></g><g id="Por que Pestalozzi"><rect x="0" y="1772" width="720" height="460" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="810" y="1922" font-family="Inter" font-size="32" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">¿Por qué Pestalozzi?</text><text x="810" y="1972" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">No somos el nombre de un pedagogo colgado en la</text><text x="810" y="1998" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">fachada. Aplicamos su método: el niño observa,</text><text x="810" y="2024" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">comprende y hace, con un maestro que acompaña</text><text x="810" y="2050" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">en grupos pequeños.</text><text x="810" y="2084" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Una institución de barrio en Ambato, con trato</text><text x="810" y="2110" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">cercano y seguimiento real de cada estudiante.</text><rect x="810" y="2138" width="180" height="46" fill="none" stroke="#0D0D0D" stroke-width="1.4"/><text x="900" y="2165.5" font-family="Inter" font-size="13" fill="#0D0D0D" font-weight="500" text-anchor="middle" letter-spacing="0.6">CONÓCENOS</text></g><g id="Galeria"><text x="720" y="2342" font-family="Inter" font-size="30" fill="#0D0D0D" font-weight="700" text-anchor="middle" letter-spacing="-0.4">La Vida en Pestalozzi</text><text x="720" y="2376" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="middle" letter-spacing="0">Instalaciones, actividades, deportes y eventos del año lectivo</text><rect x="80" y="2424" width="296" height="210" fill="#D9D9D9" stroke="none" stroke-width="1"/><rect x="408" y="2424" width="296" height="210" fill="#D9D9D9" stroke="none" stroke-width="1"/><rect x="736" y="2424" width="296" height="210" fill="#D9D9D9" stroke="none" stroke-width="1"/><rect x="1064" y="2424" width="296" height="210" fill="#D9D9D9" stroke="none" stroke-width="1"/><rect x="80" y="2666" width="296" height="210" fill="#D9D9D9" stroke="none" stroke-width="1"/><rect x="408" y="2666" width="296" height="210" fill="#D9D9D9" stroke="none" stroke-width="1"/><rect x="736" y="2666" width="296" height="210" fill="#D9D9D9" stroke="none" stroke-width="1"/><rect x="1064" y="2666" width="296" height="210" fill="#D9D9D9" stroke="none" stroke-width="1"/><rect x="620" y="2932" width="200" height="46" fill="none" stroke="#0D0D0D" stroke-width="1.4"/><text x="720" y="2959.5" font-family="Inter" font-size="13" fill="#0D0D0D" font-weight="500" text-anchor="middle" letter-spacing="0.6">VER TODA LA GALERÍA</text></g><g id="Llamado a la accion"><rect x="0" y="3108" width="1440" height="240" fill="#F8F8F8" stroke="none" stroke-width="1"/><text x="720" y="3204" font-family="Inter" font-size="30" fill="#0D0D0D" font-weight="700" text-anchor="middle" letter-spacing="-0.4">Conoce la institución antes de decidir</text><text x="720" y="3238" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="middle" letter-spacing="0">Agenda una visita guiada y recorre las aulas con nosotros.</text><rect x="610" y="3266" width="220" height="48" fill="#0D0D0D" stroke="none" stroke-width="1"/><text x="720" y="3294.5" font-family="Inter" font-size="13" fill="#FFFFFF" font-weight="500" text-anchor="middle" letter-spacing="0.6">ESCRÍBENOS POR WHATSAPP</text></g><g id="Pie de pagina"><rect x="0" y="3348" width="1440" height="300" fill="#0D0D0D" stroke="none" stroke-width="1"/><text x="80" y="3414" font-family="Inter" font-size="20" fill="#FFFFFF" font-weight="400" text-anchor="start" letter-spacing="3.2">PESTALOZZI</text><text x="80" y="3440" font-family="Inter" font-size="12" fill="#8A8A8A" font-weight="400" text-anchor="start" letter-spacing="0">Unidad Educativa · Ambato</text><text x="460" y="3410" font-family="Inter" font-size="11" fill="#8A8A8A" font-weight="600" text-anchor="start" letter-spacing="1.4">SECCIONES</text><text x="460" y="3440" font-family="Inter" font-size="12.5" fill="#E4E4E4" font-weight="400" text-anchor="start" letter-spacing="0">Inicio</text><text x="460" y="3464" font-family="Inter" font-size="12.5" fill="#E4E4E4" font-weight="400" text-anchor="start" letter-spacing="0">Nosotros</text><text x="460" y="3488" font-family="Inter" font-size="12.5" fill="#E4E4E4" font-weight="400" text-anchor="start" letter-spacing="0">Galería</text><text x="460" y="3512" font-family="Inter" font-size="12.5" fill="#E4E4E4" font-weight="400" text-anchor="start" letter-spacing="0">Contacto</text><text x="710" y="3410" font-family="Inter" font-size="11" fill="#8A8A8A" font-weig