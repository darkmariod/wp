<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2948" viewBox="0 0 1440 2948"><rect width="1440" height="2948" fill="#FFFFFF"/><g id="Barra de anuncio"><rect x="0" y="0" width="1440" height="36" fill="#0D0D0D" stroke="none" stroke-width="1"/><text x="720" y="23" font-family="Inter" font-size="12" fill="#FFFFFF" font-weight="400" text-anchor="middle" letter-spacing="0.4">Matrículas abiertas · Ciclo lectivo 2026 – 2027</text></g><g id="Encabezado"><rect x="0" y="36" width="1440" height="72" fill="#FFFFFF" stroke="none" stroke-width="1"/><line x1="0" y1="108" x2="1440" y2="108" stroke="#E4E4E4" stroke-width="1"/><text x="80" y="81" font-family="Inter" font-size="22" fill="#0D0D0D" font-weight="400" text-anchor="start" letter-spacing="3.2">PESTALOZZI</text><text x="520" y="80" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Inicio</text><text x="611.6" y="80" font-family="Inter" font-size="14" fill="#0D0D0D" font-weight="600" text-anchor="start" letter-spacing="0">Nosotros</text><line x1="611.6" y1="88" x2="672.4" y2="88" stroke="#0D0D0D" stroke-width="1.6"/><text x="718.4" y="80" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Galería</text><text x="817.6" y="80" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Contacto</text><circle cx="1150" cy="69" r="7" fill="none" stroke="#0D0D0D" stroke-width="1.8"/><line x1="1155" y1="74" x2="1160" y2="79" stroke="#0D0D0D" stroke-width="1.8"/><text x="1360" y="80" font-family="Inter" font-size="14" fill="#0D0D0D" font-weight="600" text-anchor="end" letter-spacing="0">099 824 6396</text></g><g id="Encabezado de pagina"><rect x="0" y="108" width="1440" height="220" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="80" y="226" font-family="Inter" font-size="42" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Nosotros</text><text x="80" y="260" font-family="Inter" font-size="13" fill="#5F5F5F" font-weight="400" text-anchor="start" letter-spacing="0">Inicio / Nosotros</text></g><g id="Quienes somos"><text x="80" y="458" font-family="Inter" font-size="32" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Quiénes Somos</text><text x="80" y="512" font-family="Inter" font-size="15" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">La Unidad Educativa Pestalozzi es una institución de la ciudad de</text><text x="80" y="538" font-family="Inter" font-size="15" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Ambato dedicada a la formación integral de niños y niñas.</text><text x="80" y="590" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Trabajamos con grupos reducidos, seguimiento individual y una</text><text x="80" y="616" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">relación cercana con las familias. Cada estudiante es conocido por</text><text x="80" y="642" font-family="Inter" font-size="14.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">su nombre y acompañado según su ritmo.</text><text x="80" y="690" font-family="Inter" font-size="13" fill="#A0A0A0" font-weight="400" text-anchor="start" letter-spacing="0">Texto institucional pendiente de entrega por parte del colegio.</text><rect x="750" y="438" width="610" height="400" fill="#D9D9D9" stroke="none" stroke-width="1"/></g><g id="Filosofia Pestalozzi"><rect x="0" y="968" width="1440" height="552" fill="#F8F8F8"/><text x="720" y="1078" font-family="Inter" font-size="30" fill="#0D0D0D" font-weight="700" text-anchor="middle" letter-spacing="-0.4">La Filosofía Pestalozzi</text><text x="720" y="1112" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="middle" letter-spacing="0">Cabeza, corazón y mano: las tres dimensiones del método</text><rect x="80" y="1160" width="405.333" height="230" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.4"/><text x="112" y="1222" font-family="Inter" font-size="13" fill="#7B7B7B" font-weight="600" text-anchor="start" letter-spacing="1.4">01</text><text x="112" y="1264" font-family="Inter" font-size="24" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Cabeza</text><text x="112" y="1300" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Desarrollo del pensamiento a</text><text x="112" y="1322" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">partir de la observación directa</text><text x="112" y="1344" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">y el lenguaje propio.</text><rect x="517.333" y="1160" width="405.333" height="230" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.4"/><text x="549.333" y="1222" font-family="Inter" font-size="13" fill="#7B7B7B" font-weight="600" text-anchor="start" letter-spacing="1.4">02</text><text x="549.333" y="1264" font-family="Inter" font-size="24" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Corazón</text><text x="549.333" y="1300" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Formación moral y afectiva.</text><text x="549.333" y="1322" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">El aprendizaje se sostiene en</text><text x="549.333" y="1344" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">el vínculo humano.</text><rect x="954.667" y="1160" width="405.333" height="230" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.4"/><text x="986.667" y="1222" font-family="Inter" font-size="13" fill="#7B7B7B" font-weight="600" text-anchor="start" letter-spacing="1.4">03</text><text x="986.667" y="1264" font-family="Inter" font-size="24" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Mano</text><text x="986.667" y="1300" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Habilidad práctica. El niño</text><text x="986.667" y="1322" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">construye, experimenta y</text><text x="986.667" y="1344" font-family="Inter" font-size="13.5" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">aplica lo que comprende.</text></g><g id="Mision y vision"><text x="720" y="1630" font-family="Inter" font-size="30" fill="#0D0D0D" font-weight="700" text-anchor="middle" letter-spacing="-0.4">Misión y Visión</text><rect x="80" y="1686" width="4" height="200" fill="#0D0D0D" stroke="none" stroke-width="1"/><text x="112" y="1732" font-family="Inter" font-size="22" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Misión</text><text x="112" y="1770" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Texto oficial pendiente de entrega</text><text x="112" y="1796" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">por parte de la institución.</text><text x="112" y="1822" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0"></text><text x="112" y="1848" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Se recomienda máximo 3 líneas.</text><rect x="736" y="1686" width="4" height="200" fill="#0D0D0D" stroke="none" stroke-width="1"/><text x="768" y="1732" font-family="Inter" font-size="22" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Visión</text><text x="768" y="1770" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Texto oficial pendiente de entrega</text><text x="768" y="1796" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">por parte de la institución.</text><text x="768" y="1822" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0"></text><text x="768" y="1848" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Se recomienda máximo 3 líneas.</text></g><g id="Equipo docente"><rect x="0" y="2026" width="1440" height="622" fill="#F8F8F8"/><text x="720" y="2136" font-family="Inter" font-size="30" fill="#0D0D0D" font-weight="700" text-anchor="middle" letter-spacing="-0.4">Nuestro Equipo Docente</text><text x="720" y="2170" font-family="Inter" font-size="14" fill="#7B7B7B" font-weight="400" text-anchor="middle" letter-spacing="0">Quién acompaña a los estudiantes cada día</text><rect x="80" y="2218" width="296" height="280" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="80" y="2534" font-family="Inter" font-size="16" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Nombre del docente</text><text x="80" y="2558" font-family="Inter" font-size="13" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Área o nivel a cargo</text><rect x="408" y="2218" width="296" height="280" fill="#D9D9D9" stroke="none" stroke-width="1"/><text x="408" y="2534" font-family="Inter" font-size="16" fill="#0D0D0D" font-weight="700" text-anchor="start" letter-spacing="-0.4">Nombre del docente</text><text x="408" y="2558" font-family="Inter" font-size="13" fill="#7B7B7B" font-weight="400" text-anchor="start" letter-spacing="0">Área o nivel a cargo</text><rect x="736" y="2218